name: Deploy VPS

on:
  push:
    branches: [main]
    # Mudança só de documentação não precisa rebuildar a imagem (o build na VPS é pesado).
    # `public/**` e `src/**` continuam disparando.
    paths-ignore:
      - "*.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  # Gate: nada vai pra produção sem passar por aqui. Até 2026-10-01 este
  # workflow era só `git pull` + rebuild na VPS — não existia CI nenhum neste
  # repositório, então qualquer commit ia direto para produção.
  verify:
    name: Verify (TypeCheck, Lint, Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `--legacy-peer-deps` é obrigatório: sem ele o npm 10 quebra em
      # `#loadPeerSet` (arborist) ao resolver o grafo de peers do vitest —
      # "Cannot read properties of null (reading 'edgesOut')". BUG DO NPM.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Tests
        run: npm run test

      # Ambiente hostil de propósito: se o pin de `NODE_ENV` (vitest.config)
      # for removido, o React cai no build de produção, `act()` deixa de
      # existir e a suíte morre. Este passo é o que transforma o pin em
      # invariante verificada em vez de comentário bem-intencionado.
      - name: Tests com ambiente hostil (NODE_ENV=production herdado)
        env:
          NODE_ENV: production
          PUBLIC_ORIGIN: https://hostil.invalido
          DATABASE_URL: postgresql://invalido://x@hostil:9999/db
        run: npm run test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-vps
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      # Falha fechada. A VPS faz `git pull --ff-only origin main`, que pega a
      # HEAD do branch — não o commit que o `verify` acabou de checar. Se
      # outro commit subiu durante a verificação, aborta em vez de publicar
      # código não testado; o push seguinte retoma o deploy.
      - name: Falha se a main avançou durante a verificação
        run: |
          HEAD_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "❌ main avançou durante a verificação (testado $GITHUB_SHA, branch $HEAD_SHA)."
            echo "   Deploy abortado para não publicar commit não verificado."
            exit 1
          fi
          echo "✅ HEAD da main == commit verificado (${GITHUB_SHA:0:7})"

      - name: Deploy no VPS (git pull + rebuild)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Achado 2026-10-16: sem `set -e` o script remoto segue depois de
            # um erro. O `next build` falhou na VPS, o `make deploy` retornou
            # erro, e mesmo assim o passo imprimiu "Deploy ok" e terminou
            # verde com o container na imagem antiga. Agora qualquer comando
            # que falhe aborta o deploy; a limpeza no fim é a exceção
            # (`|| true`), porque não deve reprovar um deploy que funcionou.
            set -e
            # Guarda de disco (INCIDENTES.md no infra, 2026-08-23): aborta
            # antes de piorar se a raiz estiver >=90%.
            USO=$(df --output=pcent / | tail -1 | tr -dc '0-9')
            if [ "$USO" -ge 90 ]; then
              echo "❌ Abortado: disco em ${USO}% (limite 90%). Rode: docker builder prune -af"
              exit 1
            fi
            cd /opt/cslewis
            git pull --ff-only origin main
            cd ~/hetzner-infra
            make deploy service=cslewis
            # Prune total pós-deploy (INCIDENTES.md 2026-08-23): sem filtro de
            # tempo — filtros semanais não pegam rajadas; e o prune simples (-f)
            # deixa registros compartilhados no disco (17,9GB invisíveis).
            docker builder prune -af >/dev/null || true
            docker image prune -f >/dev/null || true
            USO=$(df --output=pcent / | tail -1 | tr -dc '0-9')
            echo "✅ Deploy ok — disco em ${USO}%"

      - name: Smoke test
        run: |
          # Achado 2026-08-16: "sleep 3" fixo dava falso-negativo (container
          # às vezes ainda reiniciando) mesmo com o deploy tendo funcionado.
          # Retry de verdade: até 10 tentativas, 3s entre elas.
          for i in $(seq 1 10); do
            curl -sf -o /dev/null https://cslewis.narniano.com/ && break
            [ "$i" -eq 10 ] && exit 1
            sleep 3
          done
